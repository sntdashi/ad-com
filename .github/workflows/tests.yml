name: tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Prepare SQLite Database
        run: touch database/database.sqlite

      - name: Setup Application
        run: composer setup

      - name: Check PHP Syntax
        run: find app bootstrap config database routes tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l >/dev/null

      - name: Run PHPStan Analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M

      - name: Run CI Checks
        run: |
          npm run check
          npm run types:check
          npx vp test run
          vendor/bin/pint --parallel --test
          php artisan config:clear --ansi
          php artisan test --compact
